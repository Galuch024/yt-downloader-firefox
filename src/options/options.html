<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings – YouTube Downloader</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <form id="form">
    <label>
      <span>Subfolder in Downloads</span>
      <input id="subfolder" type="text" placeholder="(no subfolder)" maxlength="60">
      <small>Files will be saved to Downloads/<em id="folder-preview">YouTube</em>/</small>
    </label>
    <label class="check">
      <input id="saveAs" type="checkbox">
      <span>Ask where to save each file</span>
    </label>
    <label>
      <span>MP3 quality</span>
      <select id="mp3Bitrate">
        <option value="320">320 kb/s (highest)</option>
        <option value="256">256 kb/s</option>
        <option value="192">192 kb/s (recommended)</option>
        <option value="128">128 kb/s (smaller file)</option>
      </select>
    </label>
    <label>
      <span>Default MP4 quality in the extension popup</span>
      <select id="defaultQuality">
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </label>
    <label>
      <span>Simultaneous downloads</span>
      <select id="concurrency">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>
    <p id="saved" class="saved" aria-live="polite"></p>
  </form>
  <script src="options.js"></script>
</body>
</html>
