<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Ustawienia – YouTube Downloader</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <form id="form">
    <label>
      <span>Podfolder w „Pobranych”</span>
      <input id="subfolder" type="text" placeholder="(bez podfolderu)" maxlength="60">
      <small>Pliki trafią do Pobrane/<em id="folder-preview">YouTube</em>/</small>
    </label>
    <label class="check">
      <input id="saveAs" type="checkbox">
      <span>Pytaj, gdzie zapisać każdy plik</span>
    </label>
    <label>
      <span>Jakość MP3</span>
      <select id="mp3Bitrate">
        <option value="320">320 kb/s (najwyższa)</option>
        <option value="256">256 kb/s</option>
        <option value="192">192 kb/s (zalecana)</option>
        <option value="128">128 kb/s (mniejszy plik)</option>
      </select>
    </label>
    <label>
      <span>Domyślna jakość MP4 w okienku wtyczki</span>
      <select id="defaultQuality">
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </label>
    <label>
      <span>Ile pobrań jednocześnie</span>
      <select id="concurrency">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>
    <p id="saved" class="saved" aria-live="polite"></p>
  </form>
  <script src="options.js"></script>
</body>
</html>
